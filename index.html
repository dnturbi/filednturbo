<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ececf1">
  <meta name="description" content="Danh sách skin MOD Liên Quân và liên kết tải cho Android.">
  <title>Danh sách file skin</title>
  <script>
    (() => {
      let theme;
      try { theme = localStorage.getItem('skin-theme'); } catch {}
      document.documentElement.dataset.theme = theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    })();
  </script>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=8">
  <script src="app.js?v=8" defer></script>
</head>
<body>
  <main>
    <header class="page-heading"><div><p class="eyebrow">MOD LIÊN QUÂN</p><h1>Danh sách file skin</h1></div><button class="theme-toggle" id="theme-toggle" type="button" aria-label="Bật giao diện tối" aria-pressed="false" title="Bật giao diện tối"><svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z"/></svg><svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg></button></header>
    <div class="search-row"><label class="search-box"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="7"/><path d="m16 16 4.5 4.5"/></svg><input id="search" type="search" placeholder="Tìm tướng hoặc tên skin…" aria-label="Tìm theo tên tướng hoặc skin" autocomplete="off" disabled></label><span class="skin-count" id="skin-count" aria-live="polite">Đang tải…</span></div>
    <section class="skin-grid" id="skin-grid" aria-label="Danh sách skin" aria-busy="true"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></section>
    <div class="empty-state" id="empty-state" hidden><p id="empty-message"></p><button id="retry" hidden>Thử lại</button></div>
  </main>
  <dialog id="detail-dialog" aria-labelledby="detail-title">
    <div class="detail-cover"><img id="detail-image" alt=""><span class="detail-shade"></span><button id="close-detail" class="detail-close" type="button" aria-label="Đóng chi tiết"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button><span class="detail-category" id="detail-category"></span></div>
    <div class="detail-body">
      <div class="detail-title-row"><div><p class="detail-hero" id="detail-hero"></p><h2 id="detail-title"></h2></div></div>
      <p class="detail-description" id="detail-description"></p>
      <a class="detail-download" id="detail-download" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M5 17v4h14v-4"/></svg><span>Tải cho Android</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></a>
      <p class="detail-note"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v.1"/></svg>Mở trang tải bên ngoài. Làm theo hướng dẫn trên trang để tải file.</p>
    </div>
  </dialog>
</body>
</html>
